# ==========================================
# TMUX - Ubuntu / Kitty / Zsh
# ==========================================

# Prefix: Ctrl+A
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# General
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on

# Default Shell
set -g default-shell /usr/bin/zsh

# Window numbering
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Terminal
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",xterm-kitty:clipboard"
set -s set-clipboard external

# Split panes
unbind '"'
unbind %

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim navigation
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Copy mode
setw -g mode-keys vi

# Clipboard (KDE X11)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# Reload
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# ==========================================
# ALT+SHIFT SHORTCUTS (no prefix)
# ==========================================

# Panes
bind -n M-V split-window -h -c "#{pane_current_path}"
bind -n M-C split-window -v -c "#{pane_current_path}"
bind -n M-N select-pane -t :.-
bind -n M-P select-pane -t :.+
bind -n M-X kill-pane
bind -n M-O resize-pane -Z
bind -n M-R respawn-pane -k

# Resize panes
bind -n M-H resize-pane -L
bind -n M-J resize-pane -D
bind -n M-K resize-pane -U
bind -n M-L resize-pane -R

# Windows / sessions (-y: x kills the selected item without confirmation)
bind -n M-B new-window -c ~/
bind -n M-M choose-tree -wZy -O time

# Misc
bind -n M-Y copy-mode
bind -n M-G set-option -g status
bind -n M-: command-prompt

# Copy mode: rectangle selection
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ==========================================
# STATUS BAR
# ==========================================

set -g status-position bottom
set -g status-interval 5

set -g status-left-length 100
set -g status-right-length 100

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"

# ==========================================
# PLUGINS
# ==========================================

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ==========================================
# CATPPUCCIN
# ==========================================

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

# ==========================================
# SESSION RESTORE
# ==========================================

set -g @continuum-restore 'on'

# ==========================================
# TPM - KEEP LAST
# ==========================================

run '~/.tmux/plugins/tpm/tpm'
